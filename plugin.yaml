# plugin.yaml
name: hermes-livekit
label: LiveKit WebRTC
kind: platform
version: 1.8.0
description: Hermes-native voice, vision, and MiRA context transport over LiveKit
author: kortexa-ai

# MiRA's data tools are useful on Discord and other Hermes surfaces even when
# the LiveKit platform adapter is deferred. Declaring them here asks Hermes to
# import tools.py during plugin discovery and keeps one stable selectable
# toolset on every configured gateway platform.
provides_tools:
  - find_local_recommendations
  - get_current_trip_context
  - manage_trip_itinerary

provides_hooks:
  - post_api_request
  - on_session_finalize

requires_env:
  - name: LIVEKIT_URL
    description: "The WebSocket URL for your LiveKit server"
    prompt: "LiveKit URL (e.g., wss://your-instance.livekit.cloud)"
    password: false
  - name: LIVEKIT_API_KEY
    description: "Your LiveKit Project API Key"
    prompt: "LiveKit API Key"
    password: false
  - name: LIVEKIT_API_SECRET
    description: "Your LiveKit Project API Secret"
    prompt: "LiveKit API Secret"
    password: true # Hides the input in the CLI UI
