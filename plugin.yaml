# plugin.yaml
name: hermes-livekit
label: LiveKit WebRTC
kind: platform
version: 1.4.1
description: Restricted MiRA voice and tourism gateway for Hermes over LiveKit
author: kortexa-ai

# The itinerary tool is useful on Discord and other Hermes surfaces even when
# the LiveKit platform adapter is deferred. Declaring it here asks Hermes to
# import tools.py during plugin discovery and makes the toolset selectable for
# every configured gateway platform.
provides_tools:
  - manage_trip_itinerary

requires_env:
  - name: LIVEKIT_URL
    description: "The WebSocket URL for your LiveKit server"
    prompt: "LiveKit URL (e.g., wss://your-instance.livekit.cloud)"
    password: false
  - name: LIVEKIT_API_KEY
    description: "Your LiveKit Project API Key"
    prompt: "LiveKit API Key"
    password: false
  - name: LIVEKIT_API_SECRET
    description: "Your LiveKit Project API Secret"
    prompt: "LiveKit API Secret"
    password: true # Hides the input in the CLI UI
