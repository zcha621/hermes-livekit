# plugin.yaml
name: hermes-livekit
label: LiveKit WebRTC
kind: platform
version: 1.8.0
description: Hermes-native voice, vision, and MiRA context transport over LiveKit
author: kortexa-ai

# Itinerary read-only context (saved itinerary, traveller location, meeting
# transcript) is served by the hermes-mira-context MCP server
# (services/hermes-mcp) — see agents/hermes-livekit/configure_yaml.py for
# how it gets registered in mcp_servers. Saving/confirming an itinerary is a
# native plugin tool instead (itinerary_tools.py) for invocation reliability.
# (Not named tools.py: that collides with hermes-agent's own internal
# "tools" package once this plugin directory lands on sys.path.)
provides_tools:
  - save_itinerary_draft
  - confirm_itinerary_draft

provides_hooks:
  - post_api_request
  - on_session_finalize

requires_env:
  - name: LIVEKIT_URL
    description: "The WebSocket URL for your LiveKit server"
    prompt: "LiveKit URL (e.g., wss://your-instance.livekit.cloud)"
    password: false
  - name: LIVEKIT_API_KEY
    description: "Your LiveKit Project API Key"
    prompt: "LiveKit API Key"
    password: false
  - name: LIVEKIT_API_SECRET
    description: "Your LiveKit Project API Secret"
    prompt: "LiveKit API Secret"
    password: true # Hides the input in the CLI UI
